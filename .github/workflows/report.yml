name: Progress report

# Uploads progress/report.json (generated by a verified local build, see
# tools/publish_report.py) as the artifact decomp.dev reads. No game files
# are needed or used here.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check report
        run: |
          python3 -c "import json; m = json.load(open('progress/report.json'))['measures']; print(m['matched_functions'], '/', m['total_functions'], 'functions;', m['matched_code_percent'], '% code')"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: SCUS_972.64_report
          path: progress/report.json
